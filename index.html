<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Profile</title>

<style>
body{
    background:#333;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial;
}

.card{
    background:#111;
    width:350px;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

.profile{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
}

.btn{
    display:block;
    margin:15px auto;
    padding:15px;
    width:80%;
    background:white;
    border-radius:10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

    <img src="pfp.jpg" class="profile">

    <a class="btn"
       href="https://www.instagram.com/cc.beejy/"
       target="_blank">
       Instagram
    </a>

    <a class="btn"
       href="https://www.facebook.com/profile.php?id=61591063966426"
       target="_blank">
       Facebook
    </a>

</div>

</body>
</html>
